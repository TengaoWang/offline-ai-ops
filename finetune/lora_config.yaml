# mlx-lm LoRA 训练配置：Qwen3-8B（4-bit，即 QLoRA）· T1 技能路由
# 用法：mlx_lm.lora -c finetune/lora_config.yaml
model: mlx-community/Qwen3-8B-4bit
train: true
data: finetune/data
adapter_path: finetune/adapters/qwen3-8b-t1
fine_tune_type: lora
mask_prompt: true          # 只对回答部分计算损失，不学习系统提示词和用户输入
num_layers: 16             # 只微调最后 16 层，省内存
batch_size: 2
grad_accumulation_steps: 4 # 等效 batch 8
iters: 216                 # 576 条训练样本 / 等效 batch 8 ≈ 72 步/轮，共 3 轮
learning_rate: 1.0e-4
steps_per_report: 10
steps_per_eval: 36
val_batches: -1            # 验证集全部用上
save_every: 72
max_seq_length: 768        # 系统提示词约 350 token，样本很短，768 足够
grad_checkpoint: true      # 用时间换内存（16GB 的 MacBook Air）
seed: 42
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
