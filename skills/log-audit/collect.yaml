version: 1
commands:
  - id: recent-logins
    argv: [last, -n, "5"]
    timeout_s: 5
    required: false
    parser: session_count
    simulation: {status: success, returncode: 0, duration_s: 0.02, output: "ops console Oct 4 09:00\nadmin pts/0 Oct 4 08:30"}
  - id: current-sessions
    argv: [who]
    timeout_s: 5
    required: false
    parser: session_count
    simulation: {status: success, returncode: 0, duration_s: 0.01, output: "ops console Oct 4 09:00"}
  - id: system-load
    argv: [uptime]
    timeout_s: 3
    required: false
    parser: generic
    simulation: {status: success, returncode: 0, duration_s: 0.01, output: "up 10 days, load average: 0.10, 0.12, 0.09"}
