platform: windows                # 演示平台；本机命令同时写了 macOS 版本（开发机上也能真实执行）
timeout: 10
vars:
  target: 192.168.10.20          # 不通的业务地址（MES 服务器），可用 OPS_TARGET 修改
  gateway:                       # 默认网关：Windows 从 ipconfig 取，macOS 从 netstat -rn 取；都取不到用 default
    from: [ipconfig, route]
    regex: '(?:默认网关|Default Gateway)[ .]*:\s*(?:[0-9A-Fa-f:]+%\d+\s+)?(\d+\.\d+\.\d+\.\d+)|^default\s+(\d+\.\d+\.\d+\.\d+)'
    default: 192.168.10.1
  port: GigabitEthernet0/0/8     # 目标服务器接在交换机的哪个端口
  vlan: "10"                     # 该端口应属的业务 VLAN
commands:
  - id: ipconfig
    run: {windows: ipconfig /all, mac: ifconfig}
  - id: route                    # 只在 macOS 上执行（Windows 的网关已经在 ipconfig 里）
    run: {mac: netstat -rn}
  - id: ping-gateway
    run: {windows: 'ping -n 2 -w 1000 ${gateway}', mac: 'ping -c 2 -t 2 ${gateway}'}
  - id: ping-target
    run: {windows: 'ping -n 2 -w 1000 ${target}', mac: 'ping -c 2 -t 2 ${target}'}
  - id: arp
    run: {windows: arp -a, mac: arp -an}
  - id: if-brief
    run: display interface brief
    target: switch
  - id: port-vlan
    run: display port vlan
    target: switch
