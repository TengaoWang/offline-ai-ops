version: 1
commands:
  - id: target-ping
    argv: [ping, -c, "1", 192.0.2.1]
    timeout_s: 4
    required: false
    parser: ping
    simulation:
      status: failed
      returncode: 1
      duration_s: 1.0
      output: "1 packets transmitted, 0 received, 100% packet loss"
  - id: loopback-ping
    argv: [ping, -c, "1", 127.0.0.1]
    timeout_s: 4
    required: true
    parser: ping
    simulation:
      status: success
      returncode: 0
      duration_s: 0.02
      output: "1 packets transmitted, 1 received, 0% packet loss"
  - id: route-table
    argv: [netstat, -rn]
    timeout_s: 5
    required: false
    parser: line_count
    simulation:
      status: success
      returncode: 0
      duration_s: 0.03
      output: "Routing tables\nDestination Gateway Flags\ndefault 192.168.10.1 UGSc"
  - id: host-info
    argv: [uname, -n]
    timeout_s: 3
    required: false
    parser: generic
    simulation:
      status: success
      returncode: 0
      duration_s: 0.01
      output: "test-host"
